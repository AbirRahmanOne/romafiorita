name: CI

on:
  push:
    branches: [main, separate-backend]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: romafiorita
          POSTGRES_PASSWORD: romafiorita
          POSTGRES_DB: romafiorita
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U romafiorita"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://romafiorita:romafiorita@localhost:5432/romafiorita
      TEST_DATABASE_URL: postgresql+asyncpg://romafiorita:romafiorita@localhost:5432/romafiorita
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy app

      - name: Migration round-trip (Postgres)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests (Postgres-backed) + OpenAPI snapshot
        run: pytest -q

      - name: Dependency audit
        run: pip-audit
